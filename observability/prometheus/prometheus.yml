global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: ordexxa-otel-collector
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - rdexxa-otel-collector.onrender.com
        labels:
          project: ordexxa
          environment: production
